<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NO LOOK — Prototype 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;color:#eee;text-shadow:0 2px 5px #000}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
#hint{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:15px;opacity:.8;text-align:center;max-width:85%}
#eyes{pointer-events:auto;position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:82px;height:82px;border-radius:50%;border:1px solid #777;background:#101010dd;color:white;font-size:30px}
#joystick{pointer-events:auto;position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 26px);width:126px;height:126px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff30}
#stick{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#ffffff28;border:1px solid #ffffff55;transform:translate(0,0)}
#black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .12s}
#start,#dead{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050505eF;color:#fff;z-index:20}
.panel{width:min(88%,420px);text-align:center}
h1{letter-spacing:6px;font-size:32px;margin:0 0 12px}
p{opacity:.75;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #555;background:#151515;color:white;font-size:16px;margin:12px 0}
button.main{padding:13px 20px;border:0;border-radius:10px;background:#eee;color:#111;font-weight:700;font-size:16px}
#dead{display:none}
#danger{position:absolute;inset:0;border:0 solid #a00;transition:border-width .1s}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="top"><span id="timer">10:00</span><span id="name"></span></div>
  <div id="hint">Explore. Écoute. Ferme les yeux.</div>
  <div id="danger"></div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="eyes" aria-label="Fermer ou ouvrir les yeux">👁</button>
</div>
<div id="black"></div>
<div id="start"><div class="panel">
<h1>NO LOOK</h1>
<p id="status">Prototype 3D — chargement des modèles…</p>
<input id="playerName" maxlength="18" placeholder="Ton prénom">
<button class="main" id="startBtn">COMMENCER</button>
<p style="font-size:12px">Joystick gauche : marcher · glisser à droite : regarder · 👁 : fermer les yeux</p>
</div></div>
<div id="dead"><div class="panel">
<h1 id="deathTitle">TU ES MORT</h1><p id="deathText"></p>
<button class="main" id="restartBtn">RECOMMENCER</button>
</div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

const game=document.querySelector("#game"), start=document.querySelector("#start"), dead=document.querySelector("#dead");
const nameEl=document.querySelector("#name"), timerEl=document.querySelector("#timer"), black=document.querySelector("#black");
const eyesBtn=document.querySelector("#eyes"), joystick=document.querySelector("#joystick"), stick=document.querySelector("#stick");
const hint=document.querySelector("#hint"), danger=document.querySelector("#danger");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x11110f);
scene.fog=new THREE.FogExp2(0x12110f,0.012);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);
camera.rotation.order="YXZ";
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
renderer.shadowMap.enabled=false;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x6f6b61,0x21180f,1.25));
const fill=new THREE.AmbientLight(0x8a806d,0.65); scene.add(fill);
const moon=new THREE.DirectionalLight(0x8b9a9f,0.75); moon.position.set(-5,10,3); scene.add(moon);
// Flashlight attached to the player camera: keeps the horror atmosphere while making the house readable.
const flashlight=new THREE.SpotLight(0xfff1d2,8.0,22,Math.PI/5,0.72,1.4);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-6);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

const loader=new GLTFLoader();
let house,creature,loaded=0;
const houseScale=18;
const player={pos:new THREE.Vector3(0,1.15,0),yaw:0,pitch:0,speed:2.3};
const raycaster=new THREE.Raycaster();
const colliders=[];
let running=false,eyesClosed=false,startedAt=0,last=performance.now(),creatureState={phase:0,baseY:0};

function loadModel(urls, cb, label){
  const list=Array.isArray(urls)?urls:[urls];
  const tryNext=(i)=>{
    if(i>=list.length){
      console.error("Impossible de charger", label, list);
      const s=document.querySelector("#status");
      if(s) s.textContent += "\nErreur de chargement: "+label;
      return;
    }
    loader.load(list[i], g=>cb(g.scene), undefined, e=>{ console.warn("Essai échoué",list[i],e); tryNext(i+1); });
  };
  tryNext(0);
}
loadModel(["./maison.glb","./models/maison.glb"],m=>{
  house=m; house.scale.setScalar(houseScale);
  house.position.set(0,0,0);
  scene.add(house);
  house.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true;colliders.push(o);}});
  loaded++;
  // Warm practical lights to reveal furniture and preserve the intended dark horror mood.
  const warmPositions=[[ -5,0,5.2],[0,0,5.2],[-5,0,-1.5],[4.8,0,-1.2],[8,0,-1.4],[-5,-0.0,-5.0]];
  warmPositions.forEach((q,i)=>{ const l=new THREE.PointLight(0xffb35c,2.2,9,2); l.position.set(q[0],2.1,q[2]); scene.add(l); });
  document.querySelector("#status").textContent = loaded===2 ? "Maison et créature chargées. Appuie sur COMMENCER." : ("Modèles chargés : "+loaded+"/2"); if(loaded===2) hint.textContent="Maison chargée. La créature est là…";
});
loadModel(["./creature.glb","./models/creature.glb"],m=>{
  creature=m; creature.scale.setScalar(3.0);
  creature.position.set(4,0,4);
  creatureState.baseY=creature.position.y;
  scene.add(creature);
  loaded++; document.querySelector("#status").textContent = loaded===2 ? "Maison et créature chargées. Appuie sur COMMENCER." : ("Modèles chargés : "+loaded+"/2"); if(loaded===2) hint.textContent="Maison chargée. La créature est là…";
});

function setEyes(v){
  eyesClosed=v; black.style.opacity=v?"1":"0";
  eyesBtn.textContent=v?"◼":"👁";
  hint.textContent=v?"Tu ne vois plus rien. Écoute.":"Ne regarde pas trop longtemps derrière toi.";
}
eyesBtn.addEventListener("pointerdown",e=>{e.preventDefault();if(running)setEyes(!eyesClosed)});

let joy={x:0,y:0,active:false,id:null};
function updateStick(e){
  const r=joystick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy, len=Math.hypot(dx,dy), max=43;
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joystick.addEventListener("pointerdown",e=>{joy.active=true;joy.id=e.pointerId;joystick.setPointerCapture(e.pointerId);updateStick(e)});
joystick.addEventListener("pointermove",e=>{if(joy.active&&e.pointerId===joy.id)updateStick(e)});
joystick.addEventListener("pointerup",()=>{joy.active=false;joy.x=joy.y=0;stick.style.transform="translate(0,0)"});
joystick.addEventListener("pointercancel",()=>{joy.active=false;joy.x=joy.y=0;stick.style.transform="translate(0,0)"});

let look={active:false,lastX:0,lastY:0};
renderer.domElement.addEventListener("pointerdown",e=>{if(!running)return;if(e.clientX<170||e.clientY>innerHeight-190)return;look.active=true;look.lastX=e.clientX;look.lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener("pointermove",e=>{
 if(!look.active)return;
 const dx=e.clientX-look.lastX,dy=e.clientY-look.lastY; look.lastX=e.clientX;look.lastY=e.clientY;
 player.yaw-=dx*0.006; player.pitch-=dy*0.004; player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch));
});
renderer.domElement.addEventListener("pointerup",()=>look.active=false);
renderer.domElement.addEventListener("pointercancel",()=>look.active=false);

function blocked(next){
  if(!colliders.length)return false;
  const dirs=[new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1),
              new THREE.Vector3(.707,0,.707),new THREE.Vector3(-.707,0,.707),new THREE.Vector3(.707,0,-.707),new THREE.Vector3(-.707,0,-.707)];
  for(const d of dirs){
    raycaster.set(new THREE.Vector3(next.x,1.1,next.z),d);
    raycaster.far=.42;
    const hits=raycaster.intersectObjects(colliders,false);
    if(hits.length && hits[0].distance<.42)return true;
  }
  return false;
}

function move(dt){
  let f=-joy.y,r=joy.x;
  if(Math.abs(f)+Math.abs(r)<.05)return;
  const forward=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  const delta=forward.multiplyScalar(f).add(right.multiplyScalar(r)).multiplyScalar(player.speed*dt);
  if(!blocked(player.pos.clone().add(new THREE.Vector3(delta.x,0,0))))player.pos.x+=delta.x;
  if(!blocked(player.pos.clone().add(new THREE.Vector3(0,0,delta.z))))player.pos.z+=delta.z;
}

function updateCreature(dt,t){
  if(!creature)return;
  const target=player.pos.clone(); target.y=0;
  const c=creature.position.clone(); c.y=0;
  let dist=c.distanceTo(target);
  const dx=target.x-c.x,dz=target.z-c.z;
  if(dist>1.9){
    const speed=eyesClosed?1.45:0.35;
    const step=Math.min(speed*dt,dist-1.7);
    if(step>0){c.x+=dx/dist*step;c.z+=dz/dist*step;creature.position.x=c.x;creature.position.z=c.z;}
  }
  creature.rotation.y=Math.atan2(dx,dz);
  creature.position.y=creatureState.baseY+Math.sin(t*2.2)*0.025;
  const near=Math.max(0,1-Math.min(dist/7,1));
  danger.style.borderWidth=(near*10)+"px";
  if(dist<2.05 && eyesClosed===false && running){die("La créature était trop proche.")}
}

function die(msg){
  if(!running)return; running=false; dead.style.display="flex"; document.querySelector("#deathText").textContent=msg;
}
function startGame(){
  if(running)return;
  start.style.display="none";
  const n=document.querySelector("#playerName").value.trim()||"Inconnu";
  nameEl.textContent=n; player.pos.set(0,1.15,4.8); player.yaw=0;player.pitch=0;
  startedAt=performance.now(); running=true; dead.style.display="none"; setEyes(false);
  if(creature){creature.position.set(5,0,5);creatureState.baseY=0}
}
const startBtn=document.querySelector("#startBtn");
startBtn.addEventListener("click",e=>{ e.preventDefault(); startGame(); });
startBtn.addEventListener("pointerup",e=>{ e.preventDefault(); });
startBtn.addEventListener("touchend",e=>{ e.preventDefault(); startGame(); }, {passive:false});
document.querySelector("#restartBtn").addEventListener("click",startGame);

function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000); last=now;
 if(running){
   move(dt); updateCreature(dt,now/1000);
   const elapsed=(now-startedAt)/1000, left=Math.max(0,600-elapsed);
   timerEl.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(Math.floor(left%60)).padStart(2,"0")}`;
   if(left<=0)die("Le temps est écoulé.");
 }
 camera.position.copy(player.pos);
 camera.rotation.set(player.pitch,player.yaw,0);
 renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
requestAnimationFrame(loop);

window.addEventListener("error", e=>{
  console.error(e.error || e.message);
  const s=document.querySelector("#status");
  if(s && start.style.display!=="none") s.textContent="Le moteur 3D n’a pas pu démarrer. Recharge la page.";
});
window.addEventListener("unhandledrejection", e=>{
  console.error(e.reason);
  const s=document.querySelector("#status");
  if(s && start.style.display!=="none") s.textContent="Erreur de chargement du moteur 3D. Recharge la page.";
});
</script>
</body>
</html>

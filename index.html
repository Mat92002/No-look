<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NO LOOK — Prototype 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;color:#eee;text-shadow:0 2px 5px #000}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
#objective{position:absolute;top:calc(env(safe-area-inset-top) + 38px);left:12px;font-size:13px;opacity:.92}
#pause{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:12px;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff66;background:#111c;color:#fff;font-size:16px}
#hint{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:15px;opacity:.8;text-align:center;max-width:85%}
#eyes{pointer-events:auto;position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:82px;height:82px;border-radius:50%;border:1px solid #777;background:#101010dd;color:white;font-size:30px}
#joystick{pointer-events:auto;position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 26px);width:126px;height:126px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff30}
#stick{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#ffffff28;border:1px solid #ffffff55;transform:translate(0,0)}
#black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .12s}
#start,#dead,#paused{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050505ef;color:#fff;z-index:20}
.panel{width:min(88%,420px);text-align:center}
h1{letter-spacing:6px;font-size:32px;margin:0 0 12px}
p{opacity:.75;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #555;background:#151515;color:white;font-size:16px;margin:12px 0}
button.main{padding:13px 20px;border:0;border-radius:10px;background:#eee;color:#111;font-weight:700;font-size:16px}
#dead,#paused{display:none}
#loadbox{margin:10px 0 18px}
#progress{height:8px;background:#252525;border-radius:99px;overflow:hidden;border:1px solid #444}
#bar{height:100%;width:0%;background:#eee;transition:width .12s linear}
#loadlines{margin-top:9px;text-align:left;font-size:12px;opacity:.9}
#loadlines div{display:flex;justify-content:space-between;padding:3px 0}
#danger{position:absolute;inset:0;border:0 solid #a00;transition:border-width .1s}
#error{min-height:18px;font-size:12px;color:#ffb4b4;margin-top:8px;display:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="top"><span id="timer">10:00</span><span id="name"></span></div>
  <div id="objective">Fusibles installés : 0 / 3</div>
  <button id="pause" aria-label="Mettre le jeu en pause">Ⅱ</button>
  <div id="hint">Trouve les fusibles. Ne regarde pas la créature.</div>
  <div id="danger"></div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="eyes" aria-label="Fermer ou ouvrir les yeux">👁</button>
</div>
<div id="black"></div>
<div id="start"><div class="panel">
<h1>NO LOOK</h1>
<div id="loadbox">
<p id="status">Démarrage du moteur 3D…</p>
<div id="progress"><div id="bar"></div></div>
<div id="loadlines">
<div><span>Maison</span><b id="houseLoad">En attente</b></div>
<div><span>Créature</span><b id="creatureLoad">En attente</b></div>
</div>
<div id="error"></div>
</div>
<input id="playerName" maxlength="18" placeholder="Ton prénom" autocomplete="off">
<button class="main" id="startBtn" disabled style="opacity:.45">CHARGEMENT…</button>
<p style="font-size:12px">Joystick gauche : marcher · glisser à droite : regarder · 👁 : fermer les yeux</p>
</div></div>
<div id="dead"><div class="panel">
<h1 id="deathTitle">TU ES MORT</h1><p id="deathText"></p>
<button class="main" id="restartBtn">RECOMMENCER</button>
</div></div>
<div id="paused"><div class="panel">
<h1>PAUSE</h1><p>Le temps et la créature sont arrêtés.</p>
<button class="main" id="resumeBtn">REPRENDRE</button>
</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
const start=document.querySelector('#start');
const statusEl=document.querySelector('#status');
const bar=document.querySelector('#bar');
const houseLoad=document.querySelector('#houseLoad');
const creatureLoad=document.querySelector('#creatureLoad');
const errorEl=document.querySelector('#error');
const startBtn=document.querySelector('#startBtn');

function setProgress(p){bar.style.width=Math.max(0,Math.min(100,p))+'%';}
function showError(msg){errorEl.textContent=msg;errorEl.style.display='block';statusEl.textContent='Erreur de chargement';}

let THREE,GLTFLoader;
try{
  statusEl.textContent='Démarrage du moteur 3D…';
  THREE=await import('three');
  ({GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js'));
}catch(err){
  console.error(err);
  showError('Le moteur 3D n’a pas pu démarrer. Vérifie la connexion puis recharge la page.');
  throw err;
}

const game=document.querySelector('#game'), dead=document.querySelector('#dead'), paused=document.querySelector('#paused');
const nameEl=document.querySelector('#name'), timerEl=document.querySelector('#timer'), black=document.querySelector('#black');
const eyesBtn=document.querySelector('#eyes'), joystick=document.querySelector('#joystick'), stick=document.querySelector('#stick');
const hint=document.querySelector('#hint'), danger=document.querySelector('#danger');
const objectiveEl=document.querySelector('#objective'), pauseBtn=document.querySelector('#pause');

// Réglages du prototype : modifier ces valeurs suffit pour ajuster l'équilibrage.
const GAME_CONFIG=Object.freeze({
  durationSeconds:600,
  playerSpeed:2.3,
  levelLimit:8.35,
  fogDensity:.0038,
  creatureOpenEyesSpeed:.42,
  creatureClosedEyesSpeed:1.15,
  creatureAttackDistance:1.75,
  eyeReopenGraceMs:750,
  fuses:[[-5,1.15,5.2],[4.8,1.15,-1.2],[-5,1.15,-5]]
});

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x25292d);
scene.fog=new THREE.FogExp2(0x25292d,GAME_CONFIG.fogDensity);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);
camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.7;
renderer.shadowMap.enabled=false;
game.appendChild(renderer.domElement);

const skyLight=new THREE.HemisphereLight(0xd9e8f0,0x54443a,.55);scene.add(skyLight);
const ambientLight=new THREE.AmbientLight(0xc8d0d0,.25);scene.add(ambientLight);
const moon=new THREE.DirectionalLight(0xd8ecff,.55); moon.position.set(-5,10,3); scene.add(moon);
const flashlight=new THREE.SpotLight(0xffffec,20,36,Math.PI/2.8,0.4,1);
flashlight.position.set(0,0,0); flashlight.target.position.set(0,0,-6); camera.add(flashlight); camera.add(flashlight.target); scene.add(camera);

const loader=new GLTFLoader();
let house=null,creature=null,loadedCount=0;
const houseScale=18;
const player={pos:new THREE.Vector3(0,1.15,0),yaw:0,pitch:0,speed:GAME_CONFIG.playerSpeed};
const raycaster=new THREE.Raycaster();
const colliders=[];
let running=false,eyesClosed=false,startedAt=0,last=performance.now(),pausedAt=0,eyesOpenedAt=0;
const creatureState={baseY:0};
const levelLimit=GAME_CONFIG.levelLimit;
const fuses=[];
const houseLights=[];
let collected=0, powerLevel=0, audioContext=null, lastDangerBuzz=0;

function progressFromStatus(el){
  const t=el.textContent||'';
  if(t==='Chargé ✓') return 100;
  const m=t.match(/^(\d+)%$/); return m?Number(m[1]):0;
}
function updateProgress(){
  const p=Math.round((progressFromStatus(houseLoad)+progressFromStatus(creatureLoad))/2);
  setProgress(p);
  if(loadedCount===2){statusEl.textContent='Les deux modèles sont chargés. Tu peux commencer.';setProgress(100);startBtn.disabled=false;startBtn.style.opacity='1';startBtn.textContent='COMMENCER';}
  else if(!errorEl.textContent){statusEl.textContent='Chargement réel des modèles : '+p+'%';}
}

function loadModel(urls,statusNode,onLoaded,label){
  let index=0;
  function attempt(){
    const url=urls[index++];
    if(!url){statusNode.textContent='Erreur';updateProgress();showError('Impossible de charger le fichier '+label+'. Vérifie que le .glb est bien à la racine du dépôt GitHub.');return;}
    statusNode.textContent='Téléchargement…';
    updateProgress();
    loader.load(url,gltf=>{
      statusNode.textContent='Chargé ✓';
      onLoaded(gltf.scene);
      loadedCount++;
      updateProgress();
    },xhr=>{
      if(xhr && xhr.total>0){
        const p=Math.round(xhr.loaded/xhr.total*100);
        statusNode.textContent=p+'%';
        updateProgress();
      }else{
        statusNode.textContent='Téléchargement…';
      }
    },()=>{
      console.warn('Échec:',url);
      attempt();
    });
  }
  attempt();
}

loadModel(['./maison.glb','./models/maison.glb'],houseLoad,m=>{
  house=m; house.scale.setScalar(houseScale); house.position.set(0,0,0); scene.add(house);
  house.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true;colliders.push(o);}});
  // Trois circuits : chaque fusible éclaire une rangée complète de la maison.
  [[[-5,5],[0,5],[5,5]],[[-5,0],[0,0],[5,0]],[[-5,-5],[0,-5],[5,-5]]].forEach((zone,zoneIndex)=>zone.forEach((q,i)=>{
    const l=new THREE.PointLight(i===0?0xffd3a0:0xcce8ff,.05,17,1.6);
    l.position.set(q[0],2.5,q[1]);l.userData.zone=zoneIndex;houseLights.push(l);scene.add(l);
  }));
},'Maison');

loadModel(['./creature.glb','./models/creature.glb'],creatureLoad,m=>{
  creature=m; creature.scale.setScalar(3); creature.position.set(4,0,4); creatureState.baseY=0; scene.add(creature);
},'Créature');

function initAudio(){
  if(audioContext)return;
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  audioContext=new Ctx();
}
function tone(frequency,duration=.12,volume=.035){
  if(!audioContext)return;
  const osc=audioContext.createOscillator(), gain=audioContext.createGain(), now=audioContext.currentTime;
  osc.type='sine';osc.frequency.setValueAtTime(frequency,now);gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(volume,now+.015);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  osc.connect(gain).connect(audioContext.destination);osc.start(now);osc.stop(now+duration+.02);
}
function setEyes(v){
  eyesClosed=v;black.style.opacity=v?'1':'0';eyesBtn.textContent=v?'◼':'👁';
  if(!v)eyesOpenedAt=performance.now();
  hint.textContent=v?'Tu ne vois plus rien. La créature se rapproche.':'Trouve les fusibles. Ne regarde pas la créature.';
  tone(v?180:420,.09,.025);
}
eyesBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(running)setEyes(!eyesClosed)});

let joy={x:0,y:0,active:false,id:null};
function updateStick(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;}
joystick.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;joystick.setPointerCapture(e.pointerId);updateStick(e)});
joystick.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)updateStick(e)});
function resetJoy(){joy.active=false;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}
joystick.addEventListener('pointerup',resetJoy);joystick.addEventListener('pointercancel',resetJoy);

let look={active:false,lastX:0,lastY:0};
renderer.domElement.addEventListener('pointerdown',e=>{if(!running)return;if(e.clientX<170||e.clientY>innerHeight-190)return;look.active=true;look.lastX=e.clientX;look.lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!look.active)return;const dx=e.clientX-look.lastX,dy=e.clientY-look.lastY;look.lastX=e.clientX;look.lastY=e.clientY;player.yaw+=dx*.006;player.pitch-=dy*.004;player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch));});
renderer.domElement.addEventListener('pointerup',()=>look.active=false);renderer.domElement.addEventListener('pointercancel',()=>look.active=false);

function blocked(next){
  if(!colliders.length)return false;
  const d=next.clone().sub(player.pos);d.y=0;
  if(d.lengthSq()<.000001)return false;
  raycaster.set(new THREE.Vector3(player.pos.x,1.1,player.pos.z),d.normalize());
  raycaster.far=Math.min(.65,d.length()+.28);
  const hits=raycaster.intersectObjects(colliders,false);
  return hits.length>0&&hits[0].distance<raycaster.far;
}
function move(dt){let f=joy.y,r=joy.x;if(Math.abs(f)+Math.abs(r)<.05)return;const forward=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw));const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));const delta=forward.multiplyScalar(f).add(right.multiplyScalar(r)).multiplyScalar(player.speed*dt);const xNext=player.pos.clone().add(new THREE.Vector3(delta.x,0,0)),zNext=player.pos.clone().add(new THREE.Vector3(0,0,delta.z));if(Math.abs(xNext.x)<levelLimit&&!blocked(xNext))player.pos.x=xNext.x;if(Math.abs(zNext.z)<levelLimit&&!blocked(zNext))player.pos.z=zNext.z;}
function updateCreature(dt,t){
  if(!creature)return;const target=player.pos.clone();target.y=0;const c=creature.position.clone();c.y=0;const dist=c.distanceTo(target),dx=target.x-c.x,dz=target.z-c.z;
  if(dist>1.9){const speed=eyesClosed?GAME_CONFIG.creatureClosedEyesSpeed:GAME_CONFIG.creatureOpenEyesSpeed,step=Math.min(speed*dt,dist-1.7);if(step>0){c.x+=dx/dist*step;c.z+=dz/dist*step;creature.position.x=c.x;creature.position.z=c.z;}}
  creature.rotation.y=Math.atan2(dx,dz);creature.position.y=creatureState.baseY+Math.sin(t*2.2)*.025;
  const threat=Math.max(0,1-Math.min(dist/7,1));danger.style.borderWidth=(threat*10)+'px';
  const nowMs=performance.now();
  if(threat>.55&&nowMs-lastDangerBuzz>900){tone(90+threat*70,.08,.02+threat*.035);if(navigator.vibrate)navigator.vibrate(18);lastDangerBuzz=nowMs;}
  if(dist<GAME_CONFIG.creatureAttackDistance&&!eyesClosed&&performance.now()-eyesOpenedAt>GAME_CONFIG.eyeReopenGraceMs&&running)die('Tu as regardé la créature d’un peu trop près.');
}
function setPowerLevel(level){
  powerLevel=Math.max(0,Math.min(3,level));
  houseLights.forEach(light=>{light.intensity=light.userData.zone<powerLevel?6.2:.05;});
  skyLight.intensity=.55+powerLevel*.53;
  ambientLight.intensity=.25+powerLevel*.3;
  moon.intensity=.55+powerLevel*.5;
  flashlight.intensity=16+powerLevel*1.5;
  scene.fog.density=Math.max(.0038,.008-powerLevel*.0014);
}
function addFuses(){
  GAME_CONFIG.fuses.forEach((p,i)=>{
    const fuse=new THREE.Mesh(new THREE.BoxGeometry(.18,.36,.1),new THREE.MeshStandardMaterial({color:0xffe69a,emissive:0xd47a00,emissiveIntensity:2.8,roughness:.3}));
    fuse.position.set(...p);fuse.userData={fuse:true,index:i,baseY:p[1]};scene.add(fuse);fuses.push(fuse);
    const glow=new THREE.PointLight(0xffad35,1.9,5,2);glow.position.copy(fuse.position);scene.add(glow);fuse.userData.glow=glow;
  });
}
function updateFuses(t){for(const fuse of fuses){if(!fuse.visible)continue;fuse.rotation.y=t*1.8;fuse.position.y=fuse.userData.baseY+Math.sin(t*2+fuse.userData.index)*.09;if(player.pos.distanceTo(fuse.position)<.8){fuse.visible=false;fuse.userData.glow.visible=false;collected++;setPowerLevel(collected);objectiveEl.textContent=`Fusibles installés : ${collected} / 3`;hint.textContent=`Circuit ${collected} activé. La maison s'éveille.`;tone(110,.45,.07);tone(660,.22,.055);if(navigator.vibrate)navigator.vibrate([25,35,45]);if(collected===3)win();}}}
function die(msg){if(!running)return;running=false;dead.style.display='flex';document.querySelector('#deathTitle').textContent='TU ES MORT';document.querySelector('#deathText').textContent=msg;}
function win(){if(!running)return;running=false;dead.style.display='flex';document.querySelector('#deathTitle').textContent='COURANT RÉTABLI';document.querySelector('#deathText').textContent='Toute la maison s’allume. Tu as rétabli le courant et trouvé la sortie.';tone(880,.5,.06);}
function startGame(){
  if(running||loadedCount<2)return;initAudio();if(audioContext&&audioContext.state==='suspended')audioContext.resume();start.style.display='none';const n=document.querySelector('#playerName').value.trim()||'Inconnu';nameEl.textContent=n;player.pos.set(0,1.15,4.8);player.yaw=0;player.pitch=0;startedAt=performance.now();eyesOpenedAt=startedAt;collected=0;setPowerLevel(0);objectiveEl.textContent='Fusibles installés : 0 / 3';document.querySelector('#deathTitle').textContent='TU ES MORT';running=true;dead.style.display='none';paused.style.display='none';setEyes(false);for(const fuse of fuses){fuse.visible=true;fuse.userData.glow.visible=true;}if(creature)creature.position.set(5,0,5);
}
startBtn.addEventListener('click',e=>{e.preventDefault();startGame();});
document.querySelector('#restartBtn').addEventListener('click',startGame);
function togglePause(){if(!running)return;running=false;pausedAt=performance.now();paused.style.display='flex';pauseBtn.textContent='▶';}
function resumeGame(){if(running||paused.style.display!=='flex')return;startedAt+=performance.now()-pausedAt;eyesOpenedAt+=performance.now()-pausedAt;running=true;paused.style.display='none';pauseBtn.textContent='Ⅱ';}
pauseBtn.addEventListener('click',togglePause);document.querySelector('#resumeBtn').addEventListener('click',resumeGame);
addEventListener('keydown',e=>{if(e.code==='Escape'){running?togglePause():resumeGame();return;}if(!running)return;const map={KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]};if(map[e.code]){joy.x=map[e.code][0];joy.y=map[e.code][1];}if(e.code==='Space'){e.preventDefault();setEyes(!eyesClosed);}});
addEventListener('keyup',e=>{if(['KeyW','ArrowUp','KeyS','ArrowDown','KeyA','ArrowLeft','KeyD','ArrowRight'].includes(e.code))resetJoy();});
addFuses();

function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(running){move(dt);updateCreature(dt,now/1000);updateFuses(now/1000);const elapsed=(now-startedAt)/1000,left=Math.max(0,GAME_CONFIG.durationSeconds-elapsed);timerEl.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(Math.floor(left%60)).padStart(2,'0')}`;if(left<=0)die('Le temps est écoulé.');}camera.position.copy(player.pos);camera.rotation.set(player.pitch,player.yaw,0);renderer.render(scene,camera);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
requestAnimationFrame(loop);
</script>
</body>
</html>

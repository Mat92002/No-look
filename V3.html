<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NO LOOK — Prototype v3</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#timer{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:3px;text-shadow:0 2px 8px #000}
#msg{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:90%;text-align:center;font-size:20px;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .25s}
#eyes{position:absolute;right:18px;bottom:max(24px,env(safe-area-inset-bottom));width:92px;height:92px;border:1px solid #aaa;border-radius:50%;background:rgba(8,8,8,.82);color:#fff;font-weight:bold;pointer-events:auto;z-index:20}
#eyes:active{transform:scale(.96)}
#joystick{position:absolute;left:22px;bottom:max(25px,env(safe-area-inset-bottom));width:140px;height:140px;border:1px solid #777;border-radius:50%;background:rgba(20,20,20,.34);pointer-events:auto;z-index:20}
#stick{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(220,220,220,.32);border:1px solid #aaa;left:42px;top:42px;transform:translate(0,0)}
#lookHint{position:absolute;right:122px;bottom:45px;color:#aaa;font-size:11px;opacity:.6}
#black{position:fixed;inset:0;background:#000;z-index:10;display:none;pointer-events:none}
#closedHint{position:fixed;inset:0;display:none;z-index:11;pointer-events:none;align-items:center;justify-content:center;color:#666;font-size:13px;letter-spacing:2px}
.overlay{position:fixed;inset:0;background:radial-gradient(circle,#151515,#020202 70%);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.panel{width:min(420px,92vw);text-align:center}
h1{font-size:42px;letter-spacing:9px;margin:0 0 10px}
h2{letter-spacing:4px}
p{color:#aaa;line-height:1.5}
input{width:100%;padding:15px;border:1px solid #555;background:#111;color:#fff;border-radius:8px;font-size:18px;text-align:center;margin:14px 0}
button.start{width:100%;padding:15px;border:0;border-radius:8px;background:#ddd;color:#111;font-weight:bold;font-size:16px}
.small{font-size:12px;color:#666;margin-top:15px}
#death{display:none}
#voiceTest{margin-top:12px;background:#222;color:#ddd;border:1px solid #555}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="black"></div>
<div id="closedHint">ÉCOUTE…</div>

<div id="hud">
  <div id="timer">10:00</div>
  <div id="msg"></div>
  <div id="lookHint">GLISSE À DROITE POUR REGARDER</div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="eyes">FERMER<br>LES YEUX</button>
</div>

<div id="start" class="overlay">
 <div class="panel">
  <h1>NO LOOK</h1>
  <p>Entre ton prénom.<br>La pièce est calme. Pour l'instant.</p>
  <input id="name" maxlength="18" placeholder="Ton prénom" autocomplete="off">
  <button class="start" id="startBtn">ENTRER</button>
  <button class="start" id="voiceTest">TESTER LA VOIX</button>
  <div class="small">Prototype v3 — grande maison + pièces + mobilier</div>
 </div>
</div>

<div id="death" class="overlay">
 <div class="panel">
  <h2>IL T'A TROUVÉ</h2>
  <p id="deathText"></p>
  <button class="start" id="restart">RECOMMENCER</button>
 </div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const map=[
"########################",
"#......................#",
"#..######......#####...#",
"#..#....#......#...#...#",
"#..#....#......#...#...#",
"#..#....########...#...#",
"#..#...................#",
"#..#######.#############",
"#..........#............#",
"#..........#............#",
"#..........#............#",
"######.#####............#",
"#......................#",
"#....######....######..#",
"#....#....#....#....#..#",
"#....#....#....#....#..#",
"#....######....######..#",
"#......................#",
"#......................#",
"########################"
];
const MW=24,MH=20;
let p={x:3.5,y:3.5,a:0}, creature={x:19.5,y:17.5};
// Simple 3D-style furniture/props. These are lightweight prototype assets;
// later they can be replaced by real Godot 3D models.
const props=[
 {x:4.3,y:3.8,type:"bed",room:"CHAMBRE"},
 {x:6.2,y:4.2,type:"wardrobe",room:"CHAMBRE"},
 {x:3.5,y:6.1,type:"lamp",room:"CHAMBRE"},
 {x:10.1,y:4.1,type:"clock",room:"COULOIR"},
 {x:14.5,y:3.5,type:"fridge",room:"CUISINE"},
 {x:16.8,y:3.7,type:"counter",room:"CUISINE"},
 {x:15.2,y:6.1,type:"table",room:"CUISINE"},
 {x:20.0,y:3.6,type:"bath",room:"SALLE DE BAIN"},
 {x:20.2,y:5.7,type:"sink",room:"SALLE DE BAIN"},
 {x:4.1,y:9.6,type:"sofa",room:"SALON"},
 {x:6.4,y:10.5,type:"table",room:"SALON"},
 {x:3.8,y:14.2,type:"desk",room:"BUREAU"},
 {x:6.4,y:15.4,type:"chair",room:"BUREAU"},
 {x:13.6,y:14.2,type:"dining",room:"SALLE À MANGER"},
 {x:16.2,y:14.8,type:"chair",room:"SALLE À MANGER"},
 {x:20.1,y:15.0,type:"bed",room:"CHAMBRE 2"},
 {x:18.2,y:17.3,type:"wardrobe",room:"CHAMBRE 2"},
 {x:11.8,y:17.5,type:"clock",room:"COULOIR"}
];
let running=false,dead=false,eyes=false,name="",startTime=0,last=performance.now();
let duration=600;
let joystick={active:false,id:null,x:0,y:0};
let look={active:false,id:null,lastX:0};
let audio=null,voiceReady=false;
let eventState={name:false,warning:false,first:false,creatureSeen:false};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function wall(x,y){let xi=Math.floor(x),yi=Math.floor(y);return xi<0||yi<0||xi>=MW||yi>=MH||map[yi][xi]==="#"}
function move(dx,dy){
 let nx=p.x+dx,ny=p.y+dy;
 if(!wall(nx,p.y))p.x=nx;
 if(!wall(p.x,ny))p.y=ny;
}
function say(t,ms=2500){
 const el=document.getElementById('msg');el.textContent=t;el.style.opacity=1;
 clearTimeout(say.to);say.to=setTimeout(()=>el.style.opacity=0,ms);
}
function format(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0')}

function initAudio(){
 if(audio){if(audio.ac.state==='suspended')audio.ac.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;
 if(AC){
  const ac=new AC(),master=ac.createGain();
  master.gain.value=.10;master.connect(ac.destination);
  audio={ac,master};
  if(ac.state==='suspended')ac.resume();
 }
 // Prime iOS speech synthesis from the user's tap.
 if('speechSynthesis' in window){
  try{
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(" ");
   u.lang='fr-FR';u.volume=0;u.rate=1;
   speechSynthesis.speak(u);
   voiceReady=true;
  }catch(e){}
 }
}
function getFrenchVoice(){
 if(!('speechSynthesis' in window))return null;
 const voices=speechSynthesis.getVoices();
 return voices.find(v=>/^fr/i.test(v.lang)) || voices.find(v=>/fran[cç]ais/i.test(v.name)) || voices[0] || null;
}
function creepyVoice(text){
 if(!('speechSynthesis' in window))return;
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='fr-FR';u.rate=.66;u.pitch=.48;u.volume=1;
  const v=getFrenchVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);
 }catch(e){}
}
function tone(freq,dur,pan=0,vol=.12,type='sine'){
 if(!audio)return;
 const ac=audio.ac,o=ac.createOscillator(),g=ac.createGain(),sp=ac.createStereoPanner();
 o.type=type;o.frequency.value=freq;sp.pan.value=clamp(pan,-1,1);
 g.gain.setValueAtTime(.001,ac.currentTime);
 g.gain.linearRampToValueAtTime(vol,ac.currentTime+.02);
 g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
 o.connect(g);g.connect(sp);sp.connect(audio.master);o.start();o.stop(ac.currentTime+dur+.03);
}
let lastTick=0,lastCue=0,lastStep=0,lastWhisper=0;
function sounds(now){
 if(!audio)return;
 if(now-lastTick>1000){lastTick=now;tone(780,.035,0,.035,'square')}
 if(running && now-lastStep>520){
  const moving=Math.abs(joystick.x)+Math.abs(joystick.y)>.12;
  if(moving){lastStep=now;tone(115,.045,0,.045,'square');tone(75,.06,0,.025,'sine')}
 }
 if(eyes && now-lastCue>700){
  lastCue=now;
  const tx=13.5,ty=13.5,target=Math.atan2(ty-p.y,tx-p.x);
  const pan=Math.sin(norm(target-p.a)),dist=Math.hypot(tx-p.x,ty-p.y);
  tone(350+Math.max(0,14-dist)*28,.13,pan,.07,'sine');
 }
}
function start(){
 name=(document.getElementById('name').value||'').trim();
 if(!name){say("Entre ton prénom.");return}
 initAudio();
 running=true;dead=false;eyes=false;eventState={name:false,warning:false,first:false,creatureSeen:false};
 p={x:2.5,y:2.5,a:0};creature={x:12.5,y:13.5};
 startTime=performance.now();last=startTime;
 document.getElementById('start').style.display='none';
 document.getElementById('death').style.display='none';
 setEyes(false);
 say("Tu es seul. Explore.");
}
function die(reason){
 if(dead)return;dead=true;running=false;setEyes(false);
 document.getElementById('deathText').textContent=reason;
 document.getElementById('death').style.display='flex';
 creepyVoice("Je t'ai trouvé.");
 tone(55,.8,0,.3,'sawtooth');
}
function setEyes(v){
 eyes=v;
 document.getElementById('black').style.display=v?'block':'none';
 document.getElementById('closedHint').style.display=v?'flex':'none';
 document.getElementById('eyes').innerHTML=v?'OUVRIR<br>LES YEUX':'FERMER<br>LES YEUX';
}
function toggleEyes(){
 if(!running||dead)return;
 setEyes(!eyes);
 if(eyes){say("Cours. Écoute.");tone(250,.16,0,.12,'sine')}
 else {say("Tu peux regarder.");tone(850,.08,0,.08,'sine')}
}
document.getElementById('eyes').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();toggleEyes()},{passive:false});
document.getElementById('eyes').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(!e.detail)return;});
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('restart').addEventListener('click',start);
document.getElementById('voiceTest').addEventListener('click',()=>{initAudio();creepyVoice((document.getElementById('name').value||'ton prénom').trim());});

function updateStick(){
 const s=document.getElementById('stick');
 s.style.transform=`translate(${joystick.x*42}px,${joystick.y*42}px)`;
}
function joyStart(e){
 e.preventDefault();e.stopPropagation();
 const t=e.changedTouches[0];joystick.active=true;joystick.id=t.identifier;joyMove(e);
}
function joyMove(e){
 if(!joystick.active)return;
 for(const t of e.touches)if(t.identifier===joystick.id){
  const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=t.clientX-cx,dy=t.clientY-cy,max=45,len=Math.hypot(dx,dy)||1;
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  joystick.x=dx/max;joystick.y=dy/max;updateStick();
 }
}
function joyEnd(e){
 for(const t of e.changedTouches)if(t.identifier===joystick.id){
  joystick.active=false;joystick.x=joystick.y=0;updateStick();
 }
}
const j=document.getElementById('joystick');
j.addEventListener('touchstart',joyStart,{passive:false});
j.addEventListener('touchmove',joyMove,{passive:false});
j.addEventListener('touchend',joyEnd,{passive:false});
j.addEventListener('touchcancel',joyEnd,{passive:false});

canvas.addEventListener('touchstart',e=>{
 if(!running)return;
 for(const t of e.changedTouches){
  if(t.clientX>W*.42 && t.clientY<H*.72){
   look.active=true;look.id=t.identifier;look.lastX=t.clientX;
  }
 }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
 if(!look.active)return;
 for(const t of e.touches)if(t.identifier===look.id){
  let dx=t.clientX-look.lastX;look.lastX=t.clientX;p.a+=dx*.012;
 }
},{passive:false});
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===look.id)look.active=false},{passive:false});
canvas.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)if(t.identifier===look.id)look.active=false},{passive:false});

function roomAt(x,y){
 const ix=Math.floor(x),iy=Math.floor(y);
 if(ix>=2&&ix<=8&&iy>=2&&iy<=6)return "CHAMBRE";
 if(ix>=13&&ix<=18&&iy>=2&&iy<=6)return "CUISINE";
 if(ix>=19&&ix<=21&&iy>=2&&iy<=6)return "SALLE DE BAIN";
 if(ix>=2&&ix<=10&&iy>=8&&iy<=11)return "SALON";
 if(ix>=2&&ix<=7&&iy>=13&&iy<=17)return "BUREAU";
 if(ix>=12&&ix<=17&&iy>=13&&iy<=17)return "SALLE À MANGER";
 if(ix>=18&&ix<=21&&iy>=13&&iy<=17)return "CHAMBRE 2";
 return "COULOIR";
}

function propColor(type){
 return ({
  bed:"#51433a",wardrobe:"#3d3029",lamp:"#b18a52",clock:"#4a3022",
  fridge:"#626262",counter:"#51483f",table:"#594337",bath:"#6b6c68",
  sink:"#777875",sofa:"#403a36",desk:"#4b392f",chair:"#584238",dining:"#4d392d"
 })[type]||"#555";
}

function drawProp(o,screenX,size,alpha){
 const h=size,w=size*.62;
 const y=H*.55;
 ctx.save();ctx.translate(screenX,y);
 ctx.globalAlpha=alpha;
 ctx.fillStyle=propColor(o.type);
 ctx.strokeStyle="rgba(0,0,0,.75)";
 ctx.lineWidth=Math.max(1,size*.012);

 if(o.type==="bed"){
  ctx.fillRect(-w*.55,-h*.15,w*1.1,h*.42);
  ctx.fillStyle="#70655b";ctx.fillRect(-w*.48,-h*.27,w*.96,h*.18);
  ctx.fillStyle="#2b2521";ctx.fillRect(-w*.55,h*.24,w*1.1,h*.07);
 }else if(o.type==="wardrobe"){
  ctx.fillRect(-w*.38,-h*.55,w*.76,h*1.15);
  ctx.strokeRect(-w*.38,-h*.55,w*.76,h*1.15);
  ctx.fillStyle="#a08361";ctx.fillRect(-w*.03,-h*.25,w*.025,h*.32);
 }else if(o.type==="lamp"){
  ctx.fillStyle="#a9864f";ctx.fillRect(-w*.035,-h*.05,w*.07,h*.55);
  ctx.fillStyle="#d3b271";ctx.beginPath();ctx.moveTo(-w*.28,-h*.08);ctx.lineTo(w*.28,-h*.08);ctx.lineTo(w*.16,-h*.30);ctx.lineTo(-w*.16,-h*.30);ctx.closePath();ctx.fill();
 }else if(o.type==="clock"){
  ctx.fillStyle="#402b20";ctx.fillRect(-w*.25,-h*.65,w*.5,h*1.35);
  ctx.fillStyle="#b9a27b";ctx.beginPath();ctx.arc(0,-h*.28,w*.18,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#30221b";ctx.beginPath();ctx.moveTo(0,-h*.28);ctx.lineTo(0,-h*.40);ctx.moveTo(0,-h*.28);ctx.lineTo(w*.08,-h*.22);ctx.stroke();
 }else if(o.type==="fridge"){
  ctx.fillRect(-w*.35,-h*.7,w*.7,h*1.45);ctx.strokeRect(-w*.35,-h*.7,w*.7,h*1.45);
  ctx.fillStyle="#222";ctx.fillRect(w*.15,-h*.5,w*.025,h*.35);
 }else if(o.type==="counter"){
  ctx.fillRect(-w*.55,-h*.18,w*1.1,h*.35);
  ctx.fillRect(-w*.48,h*.17,w*.08,h*.48);ctx.fillRect(w*.40,h*.17,w*.08,h*.48);
 }else if(o.type==="table"||o.type==="dining"){
  ctx.fillRect(-w*.55,-h*.12,w*1.1,h*.22);
  ctx.fillRect(-w*.42,h*.08,w*.09,h*.52);ctx.fillRect(w*.33,h*.08,w*.09,h*.52);
 }else if(o.type==="bath"){
  ctx.fillStyle="#777";ctx.fillRect(-w*.55,-h*.12,w*1.1,h*.35);
  ctx.fillStyle="#aaa";ctx.fillRect(-w*.45,-h*.22,w*.9,h*.12);
 }else if(o.type==="sink"){
  ctx.fillRect(-w*.30,-h*.12,w*.6,h*.22);
  ctx.fillStyle="#999";ctx.beginPath();ctx.arc(0,-h*.12,w*.18,0,Math.PI*2);ctx.fill();
 }else if(o.type==="sofa"){
  ctx.fillRect(-w*.62,-h*.20,w*1.24,h*.42);
  ctx.fillRect(-w*.58,-h*.38,w*.20,h*.30);ctx.fillRect(w*.38,-h*.38,w*.20,h*.30);
 }else if(o.type==="desk"){
  ctx.fillRect(-w*.58,-h*.12,w*1.16,h*.20);
  ctx.fillRect(-w*.45,h*.06,w*.08,h*.55);ctx.fillRect(w*.37,h*.06,w*.08,h*.55);
  ctx.fillStyle="#191919";ctx.fillRect(-w*.18,-h*.42,w*.36,h*.25);
 }else if(o.type==="chair"){
  ctx.fillRect(-w*.25,-h*.15,w*.5,h*.2);
  ctx.fillRect(-w*.18,h*.05,w*.07,h*.45);ctx.fillRect(w*.11,h*.05,w*.07,h*.45);
  ctx.fillRect(-w*.22,-h*.48,w*.44,h*.25);
 }
 ctx.restore();
}

function render(){
 ctx.fillStyle="#050505";ctx.fillRect(0,0,W,H);
 const fov=Math.PI/3,rays=Math.max(140,Math.floor(W/3)),strip=W/rays;
 const depth=new Array(rays);

 // Walls with room-dependent warm/cold tones.
 for(let i=0;i<rays;i++){
  const a=p.a-fov/2+fov*(i/rays);
  let x=p.x,y=p.y,dx=Math.cos(a)*.035,dy=Math.sin(a)*.035,dist=0;
  while(dist<28&&!wall(x,y)){x+=dx;y+=dy;dist+=.035}
  dist*=Math.cos(a-p.a);depth[i]=dist;
  let h=Math.min(H*1.55,H/(Math.max(.05,dist)*.72));
  const room=roomAt(x,y);
  let base=room==="SALLE DE BAIN"?145:room==="CUISINE"?128:room==="CHAMBRE"?138:room==="BUREAU"?118:105;
  let shade=clamp(base-dist*6,14,125);
  const tint=room==="SALLE DE BAIN"?[.72,.76,.76]:room==="CUISINE"?[.76,.71,.62]:room==="CHAMBRE"?[.72,.66,.57]:[.72,.68,.62];
  ctx.fillStyle=`rgb(${shade*tint[0]},${shade*tint[1]},${shade*tint[2]})`;
  ctx.fillRect(i*strip,(H-h)/2,strip+1,h);
 }

 // Floor / ceiling bands.
 ctx.fillStyle="rgba(20,17,15,.26)";ctx.fillRect(0,H*.56,W,H*.44);
 ctx.fillStyle="rgba(0,0,0,.18)";ctx.fillRect(0,0,W,H*.44);

 // Props, back to front, with simple ray-depth occlusion.
 const visible=props.map(o=>{
   const dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy);
   const ang=norm(Math.atan2(dy,dx)-p.a);
   return {...o,d,ang};
 }).filter(o=>Math.abs(o.ang)<fov*.56&&o.d>.35&&o.d<15).sort((a,b)=>b.d-a.d);

 for(const o of visible){
   const sx=W/2+Math.tan(o.ang)/Math.tan(fov/2)*W/2;
   const ray=Math.floor((sx/W)*rays);
   if(ray<0||ray>=rays)continue;
   if(o.d>depth[ray]+.35)continue;
   const size=clamp(H/(o.d*.9),18,H*.85);
   drawProp(o,sx,size,clamp(1-o.d/17,.28,.95));
 }

 // Old lamp glow in the starting bedroom.
 const g=ctx.createRadialGradient(W*.5,H*.53,8,W*.5,H*.53,Math.min(W,H)*.62);
 g.addColorStop(0,"rgba(210,175,105,.13)");g.addColorStop(1,"rgba(0,0,0,.50)");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // Creature.
 const cd=Math.hypot(creature.x-p.x,creature.y-p.y);
 if(!eyes&&cd<6){
  const ang=norm(Math.atan2(creature.y-p.y,creature.x-p.x)-p.a);
  if(Math.abs(ang)<fov*.72){
   const sx=W/2+Math.tan(ang)/Math.tan(fov/2)*W/2,size=clamp(H/(cd*.68),48,H*1.35);
   const visibility=clamp(1-cd/7,.12,.94),sway=Math.sin(performance.now()/230)*size*.018,stride=Math.sin(performance.now()/180)*size*.035;
   ctx.save();ctx.translate(sx+sway,H*.50);ctx.fillStyle=`rgba(0,0,0,${visibility})`;
   ctx.beginPath();ctx.moveTo(-size*.055,size*.05);ctx.lineTo(-size*.16,size*.48);ctx.lineTo(-size*.23,size*.48);ctx.lineTo(-size*.12,size*.02);ctx.closePath();ctx.fill();
   ctx.beginPath();ctx.moveTo(size*.055,size*.05);ctx.lineTo(size*.16,size*.48);ctx.lineTo(size*.23,size*.48);ctx.lineTo(size*.12,size*.02);ctx.closePath();ctx.fill();
   ctx.beginPath();ctx.moveTo(-size*.12,-size*.10);ctx.quadraticCurveTo(-size*.18,size*.10,-size*.10,size*.20);ctx.lineTo(size*.10,size*.20);ctx.quadraticCurveTo(size*.18,size*.10,size*.12,-size*.10);ctx.closePath();ctx.fill();
   ctx.save();ctx.rotate(-.05+stride*.02);ctx.beginPath();ctx.moveTo(-size*.10,-size*.08);ctx.quadraticCurveTo(-size*.32,size*.08,-size*.34,size*.34);ctx.lineTo(-size*.39,size*.45);ctx.lineTo(-size*.45,size*.44);ctx.lineTo(-size*.40,size*.29);ctx.quadraticCurveTo(-size*.35,size*.02,-size*.15,size*-.16);ctx.closePath();ctx.fill();ctx.restore();
   ctx.save();ctx.rotate(.05-stride*.02);ctx.beginPath();ctx.moveTo(size*.10,-size*.08);ctx.quadraticCurveTo(size*.32,size*.08,size*.34,size*.34);ctx.lineTo(size*.39,size*.45);ctx.lineTo(size*.45,size*.44);ctx.lineTo(size*.40,size*.29);ctx.quadraticCurveTo(size*.35,size*.02,size*.15,-size*.16);ctx.closePath();ctx.fill();ctx.restore();
   ctx.beginPath();ctx.ellipse(0,-size*.25,size*.17,size*.22,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=`rgba(105,105,105,${clamp(visibility*.85,.08,.8)})`;
   ctx.beginPath();ctx.ellipse(-size*.065,-size*.27,size*.018,size*.035,0,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.ellipse(size*.065,-size*.27,size*.018,size*.035,0,0,Math.PI*2);ctx.fill();
   if(cd<2.7){ctx.fillStyle=`rgba(70,70,70,${visibility*.7})`;ctx.beginPath();ctx.ellipse(0,-size*.17,size*.075,size*.035,0,0,Math.PI*2);ctx.fill();}
   ctx.restore();
  }
 }

 // Small in-game room label to help during prototype testing.
 const current=roomAt(p.x,p.y);
 ctx.fillStyle="rgba(220,210,190,.55)";ctx.font="11px Arial";ctx.textAlign="center";
 ctx.fillText(current,W/2,H*.91);

 // Old lamp / warm practical.
 ctx.fillStyle="#a98550";ctx.fillRect(W/2-7,H*.57,14,66);
 ctx.fillStyle="#d6b46f";ctx.beginPath();ctx.arc(W/2,H*.54,24,0,Math.PI*2);ctx.fill();
}
function update(dt,now){
 if(!running)return;
 const elapsed=(now-startTime)/1000,remain=Math.max(0,duration-elapsed);
 document.getElementById('timer').textContent=format(remain);
 const mx=joystick.x,my=joystick.y,speed=eyes?3.0:1.7;
 const f=-my,s=mx;
 move((Math.cos(p.a)*f-Math.sin(p.a)*s)*speed*dt,(Math.sin(p.a)*f+Math.cos(p.a)*s)*speed*dt);

 if(elapsed>18 && !eventState.first){eventState.first=true;say("Le silence est bizarre ici.");tone(90,.45,0,.12,'sine')}
 if(elapsed>36 && !eventState.warning){eventState.warning=true;say("Tu entends quelque chose derrière toi…");creepyVoice("Derrière toi.");}
 if(elapsed>55 && !eventState.name){
  eventState.name=true;say(name+"…",3000);creepyVoice(name);
 }
 if(elapsed>57 && !eventState.creatureSeen && !eyes){
  eventState.creatureSeen=true;
  say("NE REGARDE PAS.",1800);
 }
 if(elapsed>59 && eventState.name && !eyes && !dead){
  die("Tu aurais dû fermer les yeux.");
  return;
 }
 if(elapsed>55){
  const ang=Math.atan2(p.y-creature.y,p.x-creature.x),sp=eyes?1.95:.72;
  creature.x+=Math.cos(ang)*sp*dt;creature.y+=Math.sin(ang)*sp*dt;
  if(Math.hypot(creature.x-p.x,creature.y-p.y)<.7){die("Quelque chose était juste derrière toi.");return}
 }
 if(remain<=0){die("Le temps est écoulé.");return}
 sounds(now);
}
function loop(now){
 const dt=Math.min(.05,(now-last)/1000||0);last=now;
 update(dt,now);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
